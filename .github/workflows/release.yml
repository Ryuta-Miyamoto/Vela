name: Release

# Release by either:
#   - Actions > Release > Run workflow (on main): tags v<MARKETING_VERSION> automatically
#   - Pushing a v* tag that matches MARKETING_VERSION
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        run: |
          PROJECT_VERSIONS=$(grep -o 'MARKETING_VERSION = [^;]*' Vela.xcodeproj/project.pbxproj | sed 's/MARKETING_VERSION = //' | sort -u)
          if [ "$(echo "$PROJECT_VERSIONS" | wc -l)" -ne 1 ]; then
            echo "::error::Debug and Release have different MARKETING_VERSION values: $PROJECT_VERSIONS"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on the main branch (current: $GITHUB_REF_NAME)"
              exit 1
            fi
            TAG="v$PROJECT_VERSIONS"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Bump MARKETING_VERSION before releasing."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PROJECT_VERSIONS" ]; then
              echo "::error::Tag $TAG does not match MARKETING_VERSION ($PROJECT_VERSIONS)"
              exit 1
            fi
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build dmg
        run: scripts/build-dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/Vela-*.dmg \
            --target "$GITHUB_SHA" \
            --title "Vela ${TAG#v}" \
            --generate-notes
